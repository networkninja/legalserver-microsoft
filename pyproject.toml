[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legalserver_microsoft"
version = "1.0.1"
description = "LegalServer Microsoft Integration Automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity",
    "msal",
    "requests",
    "cryptography",
    "questionary",
    "rich",
]

[tool.setuptools.packages.find]
include = ["legalserver_microsoft*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".git", "__pycache__", ".mypy_cache", ".venv"]
